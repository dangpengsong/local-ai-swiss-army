services:
  gateway:
    build: ./gateway
    container_name: la-gateway
    ports:
      - "8000:8000"
    environment:
      - ASR_URL=http://asr:8001
      - TTS_URL=http://tts:8004
      - NLP_URL=http://nlp:8005
      - MTRAN_URL=http://mtran:8989
      - LOCAL_AI_MOCK=${LOCAL_AI_MOCK:-auto}
      # 文本 AI 的工具能力（联网搜索／网页抓取等）总开关
      - NLP_TOOLS=${NLP_TOOLS:-true}
      # 让「现在几点」和日志时间戳都用本地时区；容器默认是 UTC，会差 8 小时
      - TZ=${TZ:-Asia/Shanghai}
      # 对外 OpenAI 兼容接口（/v1/*）的 API Key，留空则不校验
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 模型管理页的下载源（海外可改 .env 里的 HF_ENDPOINT 切回 huggingface.co）
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ./web:/app/web:ro
      - ./models:/app/models
    depends_on:
      asr:
        condition: service_started
        required: false
      tts:
        condition: service_started
        required: false
      nlp:
        condition: service_started
        required: false
    restart: unless-stopped

  asr:
    build: ./services/asr
    container_name: la-asr
    profiles: ["full"]
    ports:
      - "8001:8001"
    volumes:
      - ./models/asr:/models
    restart: unless-stopped

  tts:
    build: ./services/tts
    container_name: la-tts
    profiles: ["full"]
    ports:
      - "8004:8004"
    environment:
      # 默认中文语音；xiao_ya 为拼音方案（音质更自然），huayan 为 espeak 方案
      - TTS_PIPER_VOICE=${TTS_PIPER_VOICE:-zh_CN-xiao_ya-medium}
      # 拼音方案依赖的 g2pW 注音模型缺失时，从该镜像源下载
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # HF 缓存指向挂载卷，避免容器重建后重复下载（g2pW 的 tokenizer 等）
      - HF_HOME=/models/.hf
    volumes:
      - ./models/tts:/models
    restart: unless-stopped

  # 文本 AI 推理（Qwen3-4B）。本项目为私人定制，只保留 GPU 这一条路：
  # 官方 llama.cpp CUDA 镜像，实测 18.7 tok/s（CPU 侧 7.3 tok/s）
  nlp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: la-nlp
    profiles: ["full"]
    ports:
      - "8005:8005"
    # -ngl 99     全部层放显存
    # -c 4096     上下文；KV cache 约 144KB/token，4096 约占 590MB，再大装不下
    # -b/-ub 512  不能省。默认 n_batch=2048 的 compute buffer 要约 1.8GB，4GB
    #             显存装不下；而显式指定 -ngl 后 llama.cpp 会关掉自动显存适配
    #             （common_fit_params ... abort），表现是启动卡住而不是自己降级
    # -t 6        物理核心数，只用于 CPU 侧的辅助计算
    # --jinja     套用 GGUF 里存的 chat template；工具调用也依赖它
    command: >
      -m /models/qwen3-4b-instruct-2507-q4_k_m.gguf
      --host 0.0.0.0 --port 8005
      -ngl 99 -c 4096 -b 512 -ub 512 -t 6 --jinja
    volumes:
      - ./models/nlp:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # MTranServer 独立翻译服务（自带 /imme 端点，可直接对接沉浸式翻译）
  # 固定版本而非 latest：上游一发新版就会被拉到，行为变化不可控
  mtran:
    image: xxnuo/mtranserver:4.0.33
    container_name: la-mtran
    profiles: ["full"]
    ports:
      - "8989:8989"
    environment:
      # 模型目录指向挂载卷；否则按语言对首次翻译时下载的模型会随容器重建丢失
      - MT_MODEL_DIR=/models
    volumes:
      - ./models/mtran:/models
    restart: unless-stopped
