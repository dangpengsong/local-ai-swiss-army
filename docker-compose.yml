services:
  gateway:
    build: ./gateway
    container_name: la-gateway
    ports:
      - "8000:8000"
    environment:
      - ASR_URL=http://asr:8001
      - TTS_URL=http://tts:8004
      - NLP_URL=http://nlp:8005
      - MTRAN_URL=http://mtran:8989
      - LOCAL_AI_MOCK=${LOCAL_AI_MOCK:-auto}
      # 默认 CPU 后端；docker-compose.gpu.yml 覆盖为 openai
      - NLP_BACKEND=${NLP_BACKEND:-llamacpp}
      # 模型管理页的下载源（海外可改 .env 里的 HF_ENDPOINT 切回 huggingface.co）
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ./web:/app/web:ro
      - ./models:/app/models
    depends_on:
      asr:
        condition: service_started
        required: false
      tts:
        condition: service_started
        required: false
      nlp:
        condition: service_started
        required: false
    restart: unless-stopped

  asr:
    build: ./services/asr
    container_name: la-asr
    profiles: ["full"]
    ports:
      - "8001:8001"
    volumes:
      - ./models/asr:/models
    restart: unless-stopped

  tts:
    build: ./services/tts
    container_name: la-tts
    profiles: ["full"]
    ports:
      - "8004:8004"
    environment:
      # 默认中文语音；xiao_ya 为拼音方案（音质更自然），huayan 为 espeak 方案
      - TTS_PIPER_VOICE=${TTS_PIPER_VOICE:-zh_CN-xiao_ya-medium}
      # 拼音方案依赖的 g2pW 注音模型缺失时，从该镜像源下载
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # HF 缓存指向挂载卷，避免容器重建后重复下载（g2pW 的 tokenizer 等）
      - HF_HOME=/models/.hf
    volumes:
      - ./models/tts:/models
    restart: unless-stopped

  nlp:
    build: ./services/nlp
    container_name: la-nlp
    profiles: ["full"]
    ports:
      - "8005:8005"
    environment:
      # 留空则自动取物理核心数。不要填逻辑核数：超线程会争抢同一物理核，
      # 实测 i5-10400（6 核 12 线程）上 12 线程比 6 线程慢 28 倍
      - NLP_N_THREADS=${NLP_N_THREADS:-}
      - NLP_N_CTX=${NLP_N_CTX:-4096}
    volumes:
      - ./models/nlp:/models
    restart: unless-stopped

  # MTranServer 独立翻译服务（自带 /imme 端点，可直接对接沉浸式翻译）
  # 固定版本而非 latest：上游一发新版就会被拉到，行为变化不可控
  mtran:
    image: xxnuo/mtranserver:4.0.33
    container_name: la-mtran
    profiles: ["full"]
    ports:
      - "8989:8989"
    environment:
      # 模型目录指向挂载卷；否则按语言对首次翻译时下载的模型会随容器重建丢失
      - MT_MODEL_DIR=/models
    volumes:
      - ./models/mtran:/models
    restart: unless-stopped
