# GPU 加速覆盖层（可选）—— 把自建的 CPU 版 nlp 服务换成官方 llama.cpp CUDA 镜像
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile full up -d
#
# 服务名 / 端口 / profile 与 CPU 模式完全一致，只是 nlp 的实现换了。
# 不加这个文件时，行为与改动前一字不差。
#
# 实测（GTX 960 4GB / Qwen3-4B Q4_K_M / i5-10400）：
#   生成 18.7 tok/s vs CPU 7.3 tok/s（2.6 倍），首 token 142ms
#   显存占用 3786 / 4096 MiB —— 余量只有 256 MiB，参数不要再往上加
services:
  gateway:
    environment:
      # 让适配器改走 OpenAI 兼容端点，其余逻辑不变
      - NLP_BACKEND=openai

  nlp:
    # build 与 image 并存时 compose 会以 build 为准；!reset 清掉继承来的 build，
    # 才会真正拉取下面的镜像（需 Compose 2.24+）
    build: !reset null
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # -ngl 99     全部层放显存
    # -c 4096     上下文；KV cache 约 144KB/token，4096 约占 590MB，再大就装不下
    # -b/-ub 512  不能省。默认 n_batch=2048 的 compute buffer 要约 1.8GB，4GB 显存
    #             装不下；而显式指定 -ngl 后 llama.cpp 会关掉自动显存适配
    #             （common_fit_params ... abort），表现是启动卡住而不是自己降级
    # -t 6        物理核心数，只用于 CPU 侧的辅助计算
    # --jinja     套用 GGUF 里存的 chat template，否则 Qwen3 的对话格式不正确
    command: >
      -m /models/qwen3-4b-instruct-2507-q4_k_m.gguf
      --host 0.0.0.0 --port 8005
      -ngl 99 -c 4096 -b 512 -ub 512 -t 6 --jinja
    # 注意：本文件生效时，.env 里的 NLP_N_THREADS / NLP_N_CTX 不再起作用
    # —— 它们只被自建的 Python 服务读取，官方 server 认的是上面的命令行参数
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
